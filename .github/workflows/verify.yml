name: SACB Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run core tests
        run: python tests/test_core.py
      - name: Seal check
        run: bash scripts/github_commit.sh && test -f audit/manifest.json
